# HiMReg Configuration
# YAML configuration for image registration

# Input/Output Configuration
io:
  fixed: "data/K21/NADH-4.tif"          # Path to fixed image
  moving: "data/k21/postaf-4.tif"       # Path to moving image  
  output: "pred"                        # Output directory

# Affine Registration Configuration
affine:
  scales: [6, 4, 2, 1]                  # Multi-scale pyramid levels
  iterations: [400, 400, 200, 200]     # Iterations per scale
  scale_dependent_lr: [0.003, 0.001, 0.0005, 0.0003]  # Learning rates per scale
  loss_type: "mi"                       # Loss function: "mi", "cc", or "dice"

# Diffeomorphic Registration Configuration  
diff:
  scales: [8, 6, 4, 2, 1]              # Multi-scale pyramid levels
  iterations: [800, 600, 400, 100, 50] # Iterations per scale
  loss_type: "mi"                       # Loss function: "mi", "cc", or "dice"

# Registration Process Configuration
registration:
  register_type: "affine"               # Registration type: "affine" or "diff"
  auto_tune: true                       # Enable automatic parameter tuning
  target_loss: -0.1                     # Target loss value for auto-tuning