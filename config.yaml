# Update paths and parameters to match your dataset and registration strategy.
runtime:
  seed: 42
  deterministic: true

io:
  fixed: "data/maldi/he_rescale.tif"      # Path to the fixed/reference image
  moving: "data/maldi/redox_rescale.tif"   # Path to the moving image to be aligned
  output: "pred"                    # Directory where results are written

affine:
  scales: [6, 4, 2, 1]               # Multi-resolution scales for affine registration
  iterations: [400, 200, 100, 50]   # Iterations per scale (must match length of scales)
  scale_dependent_lr: [0.003, 0.001, 0.0005, 0.0001]  # Learning rates per scale
  loss_type: "mi"                    # One of: "mi", "cc", "dice"
  patience: 30                       # Iterations without improvement)
  min_delta: 1.0e-4                  # Minimum loss improvement to reset patience

diff:
  scales: [6, 4, 2, 1]            # Multi-resolution scales for diffeomorphic registration
  iterations: [400, 200, 100, 50]  # Iterations per scale (must match length of scales)
  loss_type: "mi"                    # One of: "mi", "cc", "dice"
  tolerance: 1.0e-4                  # Convergence slope threshold for early stopping
  max_tolerance_iters: 30            # Sliding window size for convergence check

registration:
  register_type: "diff"              # Choose "affine" for affine-only or "diff" for full pipeline
